<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Your team of always-on agents." />
    <meta name="theme-color" content="#0b0c0e" />
    <meta name="apple-mobile-web-app-title" content="Rakazo" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon.png" type="image/png" sizes="128x128" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>Rakazo</title>
    <script>
      (() => {
        const key = "rakazo.uiAppearance";
        let preference = "system";
        try {
          const stored = localStorage.getItem(key);
          if (stored === "system" || stored === "light" || stored === "dark") preference = stored;
        } catch {}
        const systemLight =
          typeof matchMedia === "function" && matchMedia("(prefers-color-scheme: light)").matches;
        const theme = preference === "system" ? (systemLight ? "light" : "dark") : preference;
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        const meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", theme === "light" ? "#fafaf8" : "#0b0c0e");
      })();
    </script>
    <script>
      // Start the shell's first requests before the bundle downloads; src/lib/rpc.ts and
      // src/lib/auth.ts adopt them.
      // Mirrors initialBootstrapTarget in src/lib/bootstrap-target.ts (pinned by a test).
      (() => {
        const path = location.pathname;
        const app = path === "/app" || path.startsWith("/app/");
        if (!app && !(window.rakazoDesktop && path === "/")) return;
        const segment = app ? path.split("/")[2] : undefined;
        let botId;
        if (segment && segment !== "g" && segment !== "artifacts" && segment !== "board") {
          try {
            botId = decodeURIComponent(segment);
          } catch {}
        }
        let spaceId = null;
        try {
          spaceId = localStorage.getItem("rakazo:space-id");
        } catch {}
        const headers = { "content-type": "application/json" };
        if (spaceId) headers["x-rakazo-space-id"] = spaceId;
        const session = fetch("/api/auth/get-session", { credentials: "include" });
        const response = fetch("/rpc/bootstrap", {
          method: "POST",
          headers,
          credentials: "include",
          body: JSON.stringify({ json: botId ? { botId } : {} }),
        });
        // A failed early request is retried by the app; keep it out of unhandled rejections.
        session.catch(() => {});
        response.catch(() => {});
        window.__rakazoEarlySession = session;
        window.__rakazoEarlyBootstrap = { botId, spaceId, response };
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
